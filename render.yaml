# Durable state is in hosted Supabase Postgres; no Render disk is needed.
services:
  - type: web
    name: heartping
    runtime: node
    plan: free
    region: frankfurt
    numInstances: 1
    buildCommand: npm ci && npm run build && npm test
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
